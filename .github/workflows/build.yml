name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            bundle_glob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundle_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundle_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pinned Cargo Tauri CLI (2.12.6)
        run: cargo install tauri-cli --version 2.12.6 --locked

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.rust_target }}" = "aarch64-apple-darwin" ]; then MR_ARCH="arm64"; else MR_ARCH="amd64"; fi
          curl -fsSL -o /tmp/ffmpeg.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${MR_ARCH}/snapshot/ffmpeg.zip"
          curl -fsSL -o /tmp/ffprobe.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${MR_ARCH}/snapshot/ffprobe.zip"
          mkdir -p /tmp/ffbin
          unzip -j -o /tmp/ffmpeg.zip -d /tmp/ffbin
          unzip -j -o /tmp/ffprobe.zip -d /tmp/ffbin
          cp /tmp/ffbin/ffmpeg "src-tauri/binaries/ffmpeg-${{ matrix.rust_target }}"
          cp /tmp/ffbin/ffprobe "src-tauri/binaries/ffprobe-${{ matrix.rust_target }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.rust_target }}" "src-tauri/binaries/ffprobe-${{ matrix.rust_target }}"

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-ext" -Force
          $binDir = (Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg-ext" -Directory | Select-Object -First 1).FullName + "\bin"
          echo $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item "$binDir\ffmpeg.exe" "src-tauri\binaries\ffmpeg-${{ matrix.rust_target }}.exe" -Force
          Copy-Item "$binDir\ffprobe.exe" "src-tauri\binaries\ffprobe-${{ matrix.rust_target }}.exe" -Force

      - name: Verify FFmpeg tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run Rust unit & integration tests
        working-directory: src-tauri
        run: |
          cargo build --bin media-shack --bin video-recover
          cargo test

      - name: Build native Tauri bundle
        run: cargo tauri build --target ${{ matrix.rust_target }} --config src-tauri/tauri.bundle.json --ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: media-shack-${{ matrix.name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
