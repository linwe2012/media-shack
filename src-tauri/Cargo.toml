[package]
name = "media-shack"
version = "0.3.5"
description = "Media Shack — overnight local video archiving and remuxing desktop app"
authors = ["Media Shack Contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "media_shack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "media-shack"
path = "src/main.rs"

[[bin]]
name = "video-recover"
path = "src/bin/video_recover.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-decorum = "1.1"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
blake3 = "1.5"
sha2 = "0.10"
tempfile = "3"
regex = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "2.10", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant",
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_System_IO",
  "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
